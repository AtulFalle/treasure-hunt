[tool.coverage.run]
branch = true
source = [ "apps/py_geo" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/py-geo/html'
 --cov-report xml:'../../coverage/apps/py-geo/coverage.xml'
 --html='../../reports/apps/py-geo/unittests/html/index.html'
 --junitxml='../../reports/apps/py-geo/unittests/junit.xml'
"""

[tool.poetry]
name = "apps/py-geo"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "apps/py_geo"

  [tool.poetry.dependencies]
  python = ">=3.10,<3.12"
  fastapi = "^0.141.1"
  uvicorn = {extras = ["standard"], version = "^0.52.1"}

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.3.1"
  flake8 = "7.1.1"
  pytest = "8.3.4"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
